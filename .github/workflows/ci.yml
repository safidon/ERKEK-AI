name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erkek_test
          POSTGRES_USER: erkek
          POSTGRES_PASSWORD: erkek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erkek -d erkek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://erkek:erkek@localhost:5432/erkek_test' || '' }}
        run: python -m pytest -q

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://example.com/api

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t erkek-backend ./backend

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://example.com/api -t erkek-frontend ./frontend

      - name: Validate compose file
        env:
          DOMAIN: example.com
          OPENAI_API_KEY: dummy
          JWT_SECRET_KEY: dummy-secret-for-config-validation-only
          POSTGRES_PASSWORD: dummy
        run: docker compose config --quiet
