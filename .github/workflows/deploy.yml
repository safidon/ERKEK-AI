name: Deploy

# main-ге push болғанда (CI сәтті өткен соң) немесе қолмен іске қосылады.
# Қосу үшін GitHub репозиторийінде баптау керек:
#   Variables:  DEPLOY_ENABLED = true
#   Secrets:    VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
#   (міндетті емес) Variables: VPS_APP_DIR (әдепкі: /opt/erkek-ai)
# Толық нұсқаулық: deploy/README.md

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/erkek-ai' }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main
          docker compose --env-file deploy/.env up -d --build --remove-orphans
          docker image prune -f
          for i in $(seq 1 30); do
            if docker compose --env-file deploy/.env exec -T backend \
                python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)" 2>/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy" >&2
          docker compose --env-file deploy/.env logs --tail 100 backend >&2
          exit 1
          REMOTE
